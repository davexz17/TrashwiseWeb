<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Collection - TrashWise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f8e9; font-family: 'Segoe UI', sans-serif; }
        .navbar { background-color: #2e7d32; }
        .navbar-brand { color: white !important; }
        .card { border: none; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
        .btn-green { background-color: #2e7d32; color: white; border-radius: 8px; }
        .btn-green:hover { background-color: #1b5e20; color: white; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
             <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="logo.png" alt="TrashWise Logo" height="42">
                <span class="fw-bold">TrashWise</span>
            </a>
            <a href="resident-dashboard.html" class="btn btn-outline-light btn-sm">← Back to Dashboard</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body p-4">
                        <h3 class="mb-4" style="color:#1b5e20;">🚚 Request Waste Collection</h3>

                        <form id="collectionForm">
                            <div class="mb-3">
                                <label class="form-label">Location / Address</label>
                                <input type="text" class="form-control" id="location" placeholder="Example: Purok 3, Barangay Tungkil" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Type of Waste</label>
                                <select class="form-select" id="wasteType" required>
                                    <option value="">Select type</option>
                                    <option>Biodegradable</option>
                                    <option>Recyclable</option>
                                    <option>Non-biodegradable</option>
                                    <option>Hazardous</option>
                                    <option>Mixed Waste</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Estimated Amount</label>
                                <select class="form-select" id="amount" required>
                                    <option value="">Select amount</option>
                                    <option>1-2 bags</option>
                                    <option>3-5 bags</option>
                                    <option>More than 5 bags</option>
                                    <option>Large pile / Bulk</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Preferred Collection Date</label>
                                <input type="date" class="form-control" id="preferredDate" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Additional Notes (optional)</label>
                                <textarea class="form-control" id="notes" rows="3" placeholder="Any special instructions..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-green w-100 py-2">Submit Collection Request</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const loggedInUser = JSON.parse(localStorage.getItem('trashwise_loggedInUser'));
        if (!loggedInUser) {
            alert("Please login first!");
            window.location.href = "login.html";
        }

        
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('preferredDate').setAttribute('min', today);

        document.getElementById('collectionForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const newRequest = {
                id: Date.now(),
                username: loggedInUser.username,
                userName: loggedInUser.fullname || loggedInUser.username,
                location: document.getElementById('location').value.trim(),
                wasteType: document.getElementById('wasteType').value,
                amount: document.getElementById('amount').value,
                preferredDate: document.getElementById('preferredDate').value,
                notes: document.getElementById('notes').value.trim(),
                status: "Pending",
                date: new Date().toLocaleString()
            };

            let requests = JSON.parse(localStorage.getItem('trashwise_collections')) || [];
            requests.push(newRequest);
            localStorage.setItem('trashwise_collections', JSON.stringify(requests));

            alert("Collection request submitted successfully!");
            window.location.href = "resident-dashboard.html";
        });
    </script>
</body>
</html>
