<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrashWise - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e8f5e9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .brand {
            font-size: 28px;
            font-weight: 700;
            color: #2e7d32;
            text-align: center;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 15px;
        }
        .form-label {
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }
        .form-control {
            border-radius: 8px;
            padding: 12px 14px;
            border: 1px solid #ddd;
        }
        .form-control:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 0.2rem rgba(46, 125, 50, 0.15);
        }
        .btn-login {
            background-color: #2e7d32;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
        }
        .btn-login:hover {
            background-color: #1b5e20;
        }
        .bottom-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .bottom-text a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 500;
        }
        .back-home {
            text-align: center;
            margin-top: 15px;
        }
        .back-home a {
            color: #666;
            font-size: 14px;
            text-decoration: none;
        }
        .back-home a:hover {
            color: #2e7d32;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand">♻️ TrashWise</div>
        <div class="subtitle">Welcome back. Please login to continue.</div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-success btn-login">Log In</button>
        </form>

        <div class="bottom-text">
            Don't have an account? <a href="register.html">Register as a resident</a>
        </div>

        <div class="back-home">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            let users = JSON.parse(localStorage.getItem('trashwise_users')) || [];
            const user = users.find(u => u.username === username && u.password === password);

            if (user) {
                localStorage.setItem('trashwise_loggedInUser', JSON.stringify(user));
                if (user.role === 'admin') {
                    window.location.href = "admin-dashboard.html";
                } else if (user.role === 'staff') {
                    window.location.href = "staff-dashboard.html";
                } else {
                    window.location.href = "resident-dashboard.html";
                }
            } else {
                if (username === "admin" && password === "admin123") {
                    localStorage.setItem('trashwise_loggedInUser', JSON.stringify({
                        fullname: "Administrator",
                        username: "admin",
                        role: "admin"
                    }));
                    window.location.href = "admin-dashboard.html";
                } else if (username === "staff" && password === "staff123") {
                    localStorage.setItem('trashwise_loggedInUser', JSON.stringify({
                        fullname: "Staff Personnel",
                        username: "staff",
                        role: "staff"
                    }));
                    window.location.href = "staff-dashboard.html";
                } else if (username === "resident" && password === "resident123") {
                    localStorage.setItem('trashwise_loggedInUser', JSON.stringify({
                        fullname: "Resident User",
                        username: "resident",
                        role: "resident"
                    }));
                    window.location.href = "resident-dashboard.html";
                } else {
                    alert("Invalid username or password");
                }
            }
        });
    </script>

</body>
</html>
