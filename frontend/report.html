<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Waste - Trashwise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
           <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
    <img src="logo.png" alt="TrashWise Logo" height="42">
    <span class="fw-bold">TrashWise</span>
</a>
            <a href="resident-dashboard.html" class="btn btn-outline-light btn-sm">← Back to Dashboard</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="mb-4" id="pageTitle">📢 Report Waste Issue</h3>

                        <form id="reportForm">
                            <div class="mb-3">
                                <label class="form-label">Type of Problem</label>
                                <select class="form-select" id="problemType" required>
                                    <option value="">Select problem</option>
                                    <option>Overflowing bins</option>
                                    <option>Improper garbage disposal</option>
                                    <option>Littering</option>
                                    <option>Illegal dumping</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Waste Category</label>
                                <select class="form-select" id="wasteCategory" required>
                                    <option value="">Select category</option>
                                    <option>Biodegradable</option>
                                    <option>Recyclable</option>
                                    <option>Non-biodegradable</option>
                                    <option>Hazardous</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Location / Address</label>
                                <input type="text" class="form-control" id="location" placeholder="Example: Purok 3, Barangay Tungkil" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <textarea class="form-control" id="description" rows="3" placeholder="Describe the problem..." required></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Photo Evidence (optional, max 1 MB)</label>
                                <input type="file" class="form-control" id="photo" accept="image/*">

                                <div id="currentPhotoBox" class="mt-2" style="display:none;">
                                    <small class="text-muted d-block mb-1">Current photo (upload a new one to replace it):</small>
                                    <img id="currentPhoto" class="img-fluid rounded border mb-2" style="max-height:180px;" alt="Current photo">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="removePhoto">
                                        <label class="form-check-label" for="removePhoto">Remove current photo</label>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success w-100 py-2" id="submitBtn">Submit Report</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const loggedInUser = JSON.parse(localStorage.getItem('trashwise_loggedInUser') || 'null');
        if (!loggedInUser || (loggedInUser.role && loggedInUser.role !== 'resident')) {
            alert("Please login first!");
            window.location.href = "login.html";
        }

        // Edit mode: report.html?edit=<id>
        const editId = new URLSearchParams(window.location.search).get('edit');
        let editing = null;

        if (loggedInUser && editId) {
            const allReports = JSON.parse(localStorage.getItem('trashwise_reports') || '[]');
            editing = allReports.find(r =>
                String(r.id) === String(editId) && r.username === loggedInUser.username
            ) || null;

            if (!editing || editing.status !== 'Pending') {
                alert("This report can no longer be edited.");
                window.location.href = "resident-dashboard.html";
            } else {
                document.getElementById('pageTitle').textContent = '✏️ Edit Report';
                document.getElementById('submitBtn').textContent = 'Save Changes';
                document.getElementById('problemType').value = editing.problemType;
                document.getElementById('wasteCategory').value = editing.wasteCategory;
                document.getElementById('location').value = editing.location;
                document.getElementById('description').value = editing.description;

                if (editing.photo) {
                    document.getElementById('currentPhoto').src = editing.photo;
                    document.getElementById('currentPhotoBox').style.display = 'block';
                }
            }
        }

        document.getElementById('reportForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const problemType = document.getElementById('problemType').value;
            const wasteCategory = document.getElementById('wasteCategory').value;
            const location = document.getElementById('location').value.trim();
            const description = document.getElementById('description').value.trim();
            const photoFile = document.getElementById('photo').files[0];

            function saveReport(photoData) {
                let reports = JSON.parse(localStorage.getItem('trashwise_reports') || '[]');

                if (editing) {
                    const target = reports.find(r => r.id === editing.id);
                    if (!target || target.status !== 'Pending') {
                        alert("This report can no longer be edited.");
                        window.location.href = "resident-dashboard.html";
                        return;
                    }
                    Object.assign(target, {
                        problemType,
                        wasteCategory,
                        location,
                        description,
                        photo: photoData,
                        edited: new Date().toLocaleString()
                    });
                } else {
                    reports.push({
                        id: Date.now(),
                        username: loggedInUser.username,
                        userName: loggedInUser.fullname || loggedInUser.username,
                        problemType,
                        wasteCategory,
                        location,
                        description,
                        photo: photoData,
                        status: "Pending",
                        date: new Date().toLocaleString()
                    });
                }

                try {
                    localStorage.setItem('trashwise_reports', JSON.stringify(reports));
                } catch (err) {
                    alert("Storage is full. Please use a smaller photo.");
                    return;
                }

                alert(editing ? "Report updated successfully!" : "Report submitted successfully!");
                window.location.href = "resident-dashboard.html";
            }

            if (photoFile) {
                if (photoFile.size > 1024 * 1024) {
                    alert("Please choose a photo under 1 MB.");
                    return;
                }
                const reader = new FileReader();
                reader.onload = () => saveReport(reader.result);
                reader.readAsDataURL(photoFile);
            } else if (editing && !document.getElementById('removePhoto').checked) {
                saveReport(editing.photo || null);
            } else {
                saveReport(null);
            }
        });
    </script>

</body>
</html>
